<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Rebanho</title>

    <!-- TensorFlow e modelo IA -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div>
            <img src="imagem/logo.png" alt="rebanho">
        </div>
        <div>
            <h1> Contador Automático de Rebanho</h1>
        </div>
        <div >
            <button onclick="toggleDarkMode()" class="logout">Tema Escuro</button>
        </div>
        <div>
            <button onclick="logout()">Sair</button>
        </div>
    </header>

 <div class="fazenda">
  <h3> Fazendas</h3>

  <input type="text" id="novaFazenda" placeholder="Nome da fazenda">
  <button onclick="adicionarFazenda()">Adicionar Fazenda</button>
  <br><br>
  <select id="selectFazenda" onchange="selecionarFazenda()"></select>
  <br>

  <h3>Pastos</h3>
  <input type="text" id="novoPasto" placeholder="Nome do pasto">
  <button onclick="adicionarPasto()">Adicionar Pasto</button>
<br><br>
  <select id="selectPasto" onchange="selecionarPasto()"></select>
  <br><br>
</div>


    <div class="camera">
        <video id="video" autoplay></video>
        <canvas id="canvas"></canvas>
    </div>
    <div class="btn">
        <button id="btnIniciar" onclick="iniciarContagem()">Iniciar Contagem</button>
        <button id="btnParar" onclick="pararContagem()" disabled>Parar Contagem</button>
        <button onclick="zerarContagem()">Zerar</button>
    </div>

    <div class="contador">
        <h2>Total de Animais</h2>
        <span id="totalSpan">0</span>
    </div>
    <div class="historico">
        <h3>Histórico de Contagem</h3>
        <ul id="listaDatas"></ul>
    </div>

    


    <script src="script.js"></script>
</body>
</html>
